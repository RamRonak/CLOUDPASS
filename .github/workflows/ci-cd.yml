name: CloudPass CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CloudPass.sln

      - name: Build solution
        run: dotnet build CloudPass.sln --configuration Release --no-restore

      - name: Run Functional, Security & Reliability Integration Tests
        run: dotnet test tests/CloudPass.Tests/CloudPass.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Verify Docker Container Build
        run: docker build -t cloudpass-web:${{ github.sha }} .

  deploy-azure:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Web App
        run: dotnet publish src/CloudPass.Web/CloudPass.Web.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
